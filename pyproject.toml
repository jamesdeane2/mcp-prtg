[project]
name = "mcp-prtg"
version = "0.1.0"
description = "MCP server for PRTG Network Monitor API"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.scripts]
mcp-prtg = "mcp_prtg.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
